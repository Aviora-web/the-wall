<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>the wall. / moderation</title><link rel="stylesheet" href="src/styles.css"><style>body{padding:50px}.admin{max-width:1100px;margin:auto}.row{border-top:1px solid var(--line);padding:20px 0;display:grid;grid-template-columns:1fr auto;gap:20px}.danger{color:#b8a69a}</style></head><body><main class="admin"><a class="brand" href="index.html">the wall<span>.</span></a><p class="eyebrow" style="margin-top:60px">PRIVATE / MODERATION</p><h1>Moderation</h1><div id="admin"></div></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';import {SUPABASE_URL,SUPABASE_ANON_KEY} from './src/config.js';const s=createClient(SUPABASE_URL,SUPABASE_ANON_KEY),el=document.querySelector('#admin');const {data:{session}}=await s.auth.getSession();if(!session){el.innerHTML='<p>Admin authentication required.</p><button id="login" class="primary">Sign in</button>';document.querySelector('#login').onclick=async()=>{await s.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}})};}else{const {data,error}=await s.rpc('admin_reports');if(error){el.innerHTML='<p>Access denied.</p>'}else{el.innerHTML=(data||[]).map(r=>`<article class="row"><div><p class="eyebrow">${r.reason} · ${r.status}</p><p>${String(r.content).replace(/[&<>]/g,'')}</p></div><button class="text-button danger" data-id="${r.post_id}">Hide post</button></article>`).join('')||'<p>No reports.</p>';el.addEventListener('click',async e=>{if(e.target.dataset.id){await s.rpc('admin_set_post_status',{p_post_id:e.target.dataset.id,p_status:'hidden'});e.target.textContent='Hidden'}})}}</script></body></html>
